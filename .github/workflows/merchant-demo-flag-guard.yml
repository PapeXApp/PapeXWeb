name: Merchant demo flag guard

# Why this exists
#
# The merchant dashboard (app/merchant/*) is selected by Host header, not by
# path. NEXT_PUBLIC_MERCHANT_DEMO_HOST_ANY=1 overrides that and makes EVERY
# host serve the dashboard — which is correct for a throwaway preview and
# catastrophic for production, where it would replace papex.app with the
# merchant dashboard.
#
# The merchant demo branch commits that flag into vercel.json's build.env so
# Vercel's auto-preview serves the dashboard. That is safe there and only
# there. It must never reach main, because .github/workflows/vercel-deploy-hook.yml
# fires a PRODUCTION deploy on every push to main — there is no manual gate
# between a merge and papex.app changing.
#
# Two independent defences, because either alone can be edited away:
#   1. this job, which refuses to let the flag into main
#   2. the VERCEL_ENV === "production" guard in lib/merchantHost.ts, exercised
#      by the PROD GUARD cases in lib/merchantHost.test.ts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  no-demo-flag-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rejects the whole build.env block rather than specific keys: the demo
      # branch has grown a second flag already (MOCK alongside DEMO_HOST_ANY),
      # and a key-by-key check silently stops covering whatever is added next.
      - name: Reject demo build.env overrides in vercel.json
        run: |
          node -e '
            const cfg = JSON.parse(require("fs").readFileSync("vercel.json", "utf8"));
            const env = cfg.build && cfg.build.env;
            const keys = env ? Object.keys(env) : [];
            if (!keys.length) { console.log("OK - vercel.json carries no build.env overrides"); process.exit(0); }
            console.log("::error file=vercel.json::vercel.json must not carry build.env overrides on main. Found: " + keys.join(", "));
            console.log("");
            console.log("These flags exist only on the merchant demo branch, where they");
            console.log("make Vercel auto-preview a working demo:");
            console.log("  NEXT_PUBLIC_MERCHANT_DEMO_HOST_ANY - every host serves the dashboard");
            console.log("  NEXT_PUBLIC_MERCHANT_MOCK          - dashboard serves invented data");
            console.log("");
            console.log("Pushing them to main triggers a production deploy (see");
            console.log(".github/workflows/vercel-deploy-hook.yml) with no manual gate.");
            console.log("");
            console.log("Fix: delete the \"build\" block from vercel.json.");
            process.exit(1);
          '

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      # The production guard in lib/merchantHost.ts is the second line of
      # defence. If someone strips this workflow but keeps the guard, or vice
      # versa, one of the two still holds. Both failing together is the only
      # way papex.app is exposed.
      - name: Guard + host-routing tests (includes PROD GUARD cases)
        run: npm run test:deployEnv && npm run test:merchantHost
